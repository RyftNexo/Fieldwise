# Required check for main. Owner: dev3.
# Make it required: Settings → Rules → Rulesets → main → "Require status checks to pass" → add "verify".
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format, lint, typecheck, tests, build
        run: npm run verify -- --ci

      - name: Ownership (pull requests)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/guard.mjs ci --branch "$HEAD_REF" --base "origin/$BASE_REF" --labels "$LABELS"

      - name: Smoke test (production build, one port)
        run: npm run smoke
